<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live_Q — Live View</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0F0F0E;
            --surface: #1A1A18;
            --surface2: #222220;
            --border: #2E2E2B;
            --text: #F0EFE9;
            --muted: #7A7870;
            --accent: #E8A020;
            --accent-dark: #C8880E;
            --green: #3DAA6A;
            --green-dim: #2D7A4F;
            --green-bg: #0D2418;
            --red: #E05252;
            --gold: #F5C842;
            --silver: #B0ADA8;
            --bronze: #C8845A;
            --mono: 'DM Mono', monospace;
            --sans: 'DM Sans', sans-serif;
        }

        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        /* TOP BAR */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 1.5rem;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .brand { font-family: var(--mono); font-size: 0.95rem; font-weight: 500; letter-spacing: 0.05em; }
        .brand span { color: var(--accent); }

        .topbar-center {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .quiz-title-bar {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
        }

        .status-pill {
            font-family: var(--mono);
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            background: var(--green-bg);
            color: var(--green);
            border: 1px solid var(--green-dim);
        }

        .status-pill.idle {
            background: var(--surface2);
            color: var(--muted);
            border-color: var(--border);
        }

        .topbar-right { display: flex; gap: 0.75rem; align-items: center; }

        .btn-sm {
            font-family: var(--sans);
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.3rem 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: none;
            color: var(--muted);
            text-decoration: none;
            transition: border-color 0.15s, color 0.15s;
        }
        .btn-sm:hover { border-color: #555; color: var(--text); }

        /* MAIN LAYOUT */
        .layout {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        /* LEFT PANEL */
        .left-panel {
            width: 340px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: var(--surface);
        }

        @media (max-width: 900px) {
            .layout { flex-direction: column; }
            .left-panel { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
            html, body { overflow: auto; }
        }

        /* JOIN INFO */
        .join-section {
            padding: 1.25rem 1.25rem 1rem;
            border-bottom: 1px solid var(--border);
        }

        .section-label {
            font-family: var(--mono);
            font-size: 0.62rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.875rem;
        }

        .join-inner {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .qr-wrap {
            background: #fff;
            border-radius: 6px;
            padding: 6px;
            flex-shrink: 0;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-wrap img { width: 100%; height: 100%; object-fit: contain; }

        .join-details { flex: 1; min-width: 0; }

        .pin-display {
            font-family: var(--mono);
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .pin-label {
            font-family: var(--mono);
            font-size: 0.62rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.75rem;
        }

        .join-url {
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--muted);
            word-break: break-all;
            line-height: 1.4;
            margin-bottom: 0.5rem;
        }

        .join-url span {
            color: var(--text);
            font-weight: 500;
        }

        .copy-row {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn-copy {
            font-family: var(--mono);
            font-size: 0.65rem;
            font-weight: 500;
            padding: 0.25rem 0.6rem;
            border-radius: 3px;
            border: 1px solid var(--border);
            background: none;
            color: var(--muted);
            cursor: pointer;
            transition: border-color 0.12s, color 0.12s;
        }
        .btn-copy:hover { border-color: var(--accent); color: var(--accent); }
        .btn-copy.copied { border-color: var(--green); color: var(--green); }

        /* QUESTION CONTROLS */
        .questions-section {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 1.25rem;
        }

        .q-controls {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .q-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.6rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--surface2);
            transition: border-color 0.12s;
        }

        .q-row.active {
            border-color: var(--green-dim);
            background: var(--green-bg);
        }

        .q-label {
            font-family: var(--mono);
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--muted);
            flex-shrink: 0;
            width: 2rem;
        }

        .q-row.active .q-label { color: var(--green); }

        .q-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--border);
            flex-shrink: 0;
        }

        .q-row.active .q-dot { background: var(--green); }

        .q-spacer { flex: 1; }

        .q-answered {
            font-family: var(--mono);
            font-size: 0.62rem;
            color: var(--muted);
            flex-shrink: 0;
        }

        .btn-openq {
            font-family: var(--sans);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 3px;
            cursor: pointer;
            border: none;
            flex-shrink: 0;
            transition: opacity 0.12s;
        }

        .btn-openq.open-btn { background: var(--text); color: var(--bg); }
        .btn-openq.open-btn:hover { opacity: 0.8; }
        .btn-openq.close-btn { background: none; color: var(--red); border: 1px solid var(--red); }
        .btn-openq.close-btn:hover { background: rgba(224,82,82,0.1); }

        /* RIGHT PANEL — LEADERBOARD */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg);
        }

        .lb-header {
            padding: 1rem 1.5rem 0.75rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: baseline;
            gap: 1rem;
            flex-shrink: 0;
        }

        .lb-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .lb-subtitle {
            font-family: var(--mono);
            font-size: 0.65rem;
            color: var(--muted);
        }

        .lb-count {
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--accent);
            margin-left: auto;
        }

        .lb-body {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 0;
        }

        /* Leaderboard rows */
        .btn-refresh {
            font-family: var(--mono);
            font-size: 1rem;
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 4px;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.12s, color 0.12s;
            margin-left: 0.5rem;
        }
        .btn-refresh:hover { border-color: var(--accent); color: var(--accent); }

        .lb-row {
            display: flex;
            align-items: center;
            padding: 0.9rem 1.5rem;
            border-bottom: 1px solid var(--border);
            gap: 1rem;
            transition: background 0.15s;
        }

        .lb-row:last-child { border-bottom: none; }
        .lb-row:hover { background: var(--surface2); }

        .lb-row.rank-1 { background: rgba(245,200,66,0.08); border-left: 3px solid var(--gold); }
        .lb-row.rank-2 { background: rgba(176,173,168,0.06); border-left: 3px solid var(--silver); }
        .lb-row.rank-3 { background: rgba(200,132,90,0.06); border-left: 3px solid var(--bronze); }
        .lb-row:not(.rank-1):not(.rank-2):not(.rank-3) { border-left: 3px solid transparent; }

        .lb-rank {
            font-family: var(--mono);
            font-size: 1.5rem;
            font-weight: 700;
            width: 3rem;
            flex-shrink: 0;
            text-align: center;
            line-height: 1;
        }

        .rank-1 .lb-rank { color: var(--gold); font-size: 1.8rem; }
        .rank-2 .lb-rank { color: var(--silver); font-size: 1.6rem; }
        .rank-3 .lb-rank { color: var(--bronze); font-size: 1.5rem; }
        .lb-row:not(.rank-1):not(.rank-2):not(.rank-3) .lb-rank { color: var(--muted); font-size: 1rem; font-weight: 500; }

        .lb-name {
            font-size: 1.2rem;
            font-weight: 700;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: 0.01em;
        }

        .rank-1 .lb-name { font-size: 1.4rem; color: var(--gold); }
        .rank-2 .lb-name { font-size: 1.25rem; }

        .lb-stats {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            flex-shrink: 0;
            gap: 0.1rem;
        }

        .lb-correct {
            font-family: var(--mono);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--green);
            line-height: 1;
        }

        .rank-1 .lb-correct { font-size: 1.8rem; }
        .rank-2 .lb-correct { font-size: 1.6rem; }

        .lb-speed {
            font-family: var(--mono);
            font-size: 0.68rem;
            color: var(--muted);
        }

        .lb-empty {
            padding: 3rem 1.5rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .lb-empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.4; }

        /* Bottom bar */
        .bottom-bar {
            flex-shrink: 0;
            border-top: 1px solid var(--border);
            padding: 0.6rem 1.5rem;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: var(--mono);
            font-size: 0.68rem;
            color: var(--muted);
        }

        .pulse {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            margin-right: 0.4rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .current-q-panel {
            flex-shrink: 0;
            border-top: 2px solid var(--green-dim);
            background: var(--surface);
            padding: 1rem 1.5rem 1.1rem;
            max-height: 260px;
            overflow-y: auto;
        }

        .cq-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.6rem;
        }

        .cq-label {
            font-family: var(--mono);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--green);
        }

        .cq-type-badge {
            font-family: var(--mono);
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            padding: 0.2rem 0.55rem;
            border-radius: 3px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--muted);
        }

        .cq-type-badge.multi { background: rgba(232,160,32,0.15); border-color: var(--accent-dark); color: var(--accent); font-size: 0.7rem; }

        .cq-text {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.45;
            margin-bottom: 0.75rem;
        }

        .cq-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.5rem;
        }

        .cq-opt {
            font-family: var(--mono);
            font-size: 0.82rem;
            padding: 0.35rem 0.7rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            color: var(--text);
            background: var(--surface2);
            line-height: 1.3;
        }

        .cq-opt.correct-opt {
            border-color: var(--green-dim);
            background: var(--green-bg);
            color: var(--green);
        }

        .cq-answer-reveal {
            margin-top: 0.75rem;
            padding: 0.5rem 0.75rem;
            background: var(--green-bg);
            border: 1px solid var(--green-dim);
            border-radius: 4px;
            font-size: 0.82rem;
            color: var(--green);
            font-family: var(--mono);
        }

        .cq-answer-label {
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0.7;
            margin-bottom: 0.2rem;
        }

        .cq-no-question {
            font-size: 0.85rem;
            color: var(--muted);
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="brand">Live<span>_Q</span></div>
    <div class="topbar-center">
        <div class="quiz-title-bar" id="quizTitleBar">—</div>
        <div class="status-pill idle" id="statusPill">Idle</div>
    </div>
    <div class="topbar-right">
        <a href="/admin" class="btn-sm">← Dashboard</a>
    </div>
</div>

<div class="layout">
    <!-- LEFT: Join info + Question controls -->
    <div class="left-panel">
        <div class="join-section">
            <div class="section-label">Join this quiz</div>
            <div class="join-inner">
                <div class="qr-wrap"><img id="qrImg" src="" alt="QR"></div>
                <div class="join-details">
                    <div class="pin-label">Quiz PIN</div>
                    <div class="pin-display" id="pinDisplay">——</div>
                    <div class="join-url" id="joinUrlDisplay">—</div>
                    <div class="copy-row">
                        <button class="btn-copy" onclick="copyText('pinDisplay', this)">Copy PIN</button>
                        <button class="btn-copy" onclick="copyText('joinUrlDisplay', this)">Copy Link</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="questions-section">
            <div class="section-label">Questions</div>
            <div class="q-controls" id="qControls">
                <div style="color:var(--muted);font-size:0.8rem;">Loading...</div>
            </div>
        </div>
    </div>

    <!-- RIGHT: Leaderboard -->
    <div class="right-panel">
        <div class="lb-header">
            <div class="lb-title">Leaderboard</div>
            <div class="lb-subtitle">Most correct → fastest</div>
            <div class="lb-count" id="participantCount">0 participants</div>
            <button class="btn-refresh" onclick="refreshLb()" title="Refresh leaderboard">↻</button>
        </div>
        <div class="lb-body" id="lbBody">
            <div class="lb-empty">
                <div class="lb-empty-icon">👥</div>
                <div>No participants yet.</div>
                <div style="font-size:0.78rem;margin-top:0.4rem">Share the PIN or QR code to get started.</div>
            </div>
        </div>
        <div class="current-q-panel" id="currentQPanel" style="display:none;">
            <div class="cq-header">
                <span class="cq-label" id="cqLabel">—</span>
                <span class="cq-type-badge" id="cqTypeBadge">—</span>
            </div>
            <div class="cq-text" id="cqText">—</div>
            <div class="cq-options" id="cqOptions"></div>
        </div>
        <div class="bottom-bar">
            <div><span class="pulse"></span>Live updates</div>
            <div id="lbUpdatedAt">—</div>
        </div>
    </div>
</div>

<script>
const quizId = "{{ quiz_id }}";
const quizData = {{ quiz | tojson }};
const joinUrl = "{{ join_url }}";
const qrB64 = "{{ qr_b64 }}";

// Init
document.getElementById('quizTitleBar').textContent = quizData.title;
document.getElementById('pinDisplay').textContent = quizData.pin;
document.getElementById('joinUrlDisplay').textContent = joinUrl;
document.getElementById('qrImg').src = qrB64 ? 'data:image/png;base64,' + qrB64
    : 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(joinUrl);

const socket = io();
let activeQId = quizData.active_question_id;
let answerCounts = {};
let lastQuestion = null;

socket.on('connect', function() {
    socket.emit('join_quiz', { quiz_id: quizId });
    socket.emit('get_leaderboard', { quiz_id: quizId });
});

socket.on('question_opened', function(data) {
    activeQId = data.question_id;
    lastQuestion = data.question;
    updateStatusPill(true);
    renderQControls();
    showCurrentQuestion(data.question, data.question_id);
});

socket.on('question_closed', function(data) {
    var correctAnswer = data && data.correct_answer ? data.correct_answer : null;
    if (activeQId !== null && lastQuestion) {
        showAnswerReveal(lastQuestion, activeQId, correctAnswer);
        answerCounts[activeQId] = (answerCounts[activeQId] || 0);
    }
    activeQId = null;
    updateStatusPill(false);
    renderQControls();
});

socket.on('leaderboard_update', function(data) {
    renderLeaderboard(data.leaderboard);
    document.getElementById('lbUpdatedAt').textContent = 'Updated ' + new Date().toLocaleTimeString();
});

function updateStatusPill(running) {
    var pill = document.getElementById('statusPill');
    pill.textContent = running ? ('Q' + (activeQId + 1) + ' Open') : 'Idle';
    pill.className = 'status-pill' + (running ? '' : ' idle');
}

if (activeQId !== null) updateStatusPill(true);

function renderQControls() {
    var questions = quizData.questions_data || [];
    var html = '';
    questions.forEach(function(q, i) {
        var isActive = activeQId === i;
        html += '<div class="q-row ' + (isActive ? 'active' : '') + '">' +
            '<span class="q-label">Q' + (i+1) + '</span>' +
            '<span class="q-dot"></span>' +
            '<span class="q-spacer"></span>' +
            (answerCounts[i] ? '<span class="q-answered">' + answerCounts[i] + ' ans</span>' : '') +
            (isActive
                ? '<button class="btn-openq close-btn" onclick="closeQ()">Close</button>'
                : '<button class="btn-openq open-btn" onclick="openQ(' + i + ')">Open</button>') +
            '</div>';
    });
    document.getElementById('qControls').innerHTML = html || '<div style="color:var(--muted);font-size:0.8rem;">No questions.</div>';
}

renderQControls();

function openQ(qId) {
    fetch('/admin/quiz/' + quizId + '/question/open/' + qId, { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function() {
            activeQId = qId;
            updateStatusPill(true);
            renderQControls();
        });
}

function closeQ() {
    var qIdToClose = activeQId;
    var qToReveal = lastQuestion;
    fetch('/admin/quiz/' + quizId + '/question/close', { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            // Show answer reveal immediately when admin clicks close
            if (qIdToClose !== null && qToReveal) {
                var correctAnswer = data && data.correct_answer ? data.correct_answer : null;
                showAnswerReveal(qToReveal, qIdToClose, correctAnswer);
            }
            if (qIdToClose !== null) {
                answerCounts[qIdToClose] = (answerCounts[qIdToClose] || 0);
            }
            activeQId = null;
            updateStatusPill(false);
            renderQControls();
        });
}

function renderLeaderboard(board) {
    var body = document.getElementById('lbBody');
    var count = document.getElementById('participantCount');

    if (!board || board.length === 0) {
        body.innerHTML = '<div class="lb-empty"><div class="lb-empty-icon">&#128101;</div><div>No participants yet.</div><div style="font-size:0.78rem;margin-top:0.4rem">Share the PIN or QR code to get started.</div></div>';
        count.textContent = '0 participants';
        return;
    }

    count.textContent = board.length + ' participant' + (board.length !== 1 ? 's' : '');

    var medals = ['&#127947;', '&#129352;', '&#129353;'];

    body.innerHTML = board.slice(0, 50).map(function(p, i) {
        var rankClass = i < 3 ? 'rank-' + (i+1) : '';
        var rankLabel = i < 3 ? medals[i] : (i + 1);
        return '<div class="lb-row ' + rankClass + '">' +
            '<div class="lb-rank">' + rankLabel + '</div>' +
            '<div class="lb-name">' + escHtml(p.username) + '</div>' +
            '<div class="lb-stats">' +
            '<div class="lb-correct">' + p.correct + ' &#10003;</div>' +
            '<div class="lb-speed">' + p.speed_points + ' spd</div>' +
            '</div></div>';
    }).join('');
}

function showCurrentQuestion(q, qId) {
    var panel = document.getElementById('currentQPanel');
    var label = document.getElementById('cqLabel');
    var badge = document.getElementById('cqTypeBadge');
    var text = document.getElementById('cqText');
    var opts = document.getElementById('cqOptions');

    var typeMap = {
        'mcq': 'Single correct',
        'true_false': 'True / False',
        'fill_up': 'Fill in the blank',
        'multi_correct': 'Multi correct — select all that apply'
    };
    var isMulti = q.type === 'multi_correct';

    label.textContent = 'Q' + (qId + 1) + ' — Now open';
    badge.textContent = typeMap[q.type] || q.type;
    badge.className = 'cq-type-badge' + (isMulti ? ' multi' : '');
    text.innerHTML = (q.q || '').split('\n').map(function(l){return escHtml(l).replace(/\t/g,'\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;').replace(/ {2}/g,'\u0026nbsp;\u0026nbsp;');}).join('<br>');

    var optHtml = '';
    if (q.options) {
        q.options.forEach(function(opt, i) {
            optHtml += '<span class="cq-opt">' + String.fromCharCode(65+i) + '. ' + escHtml(opt) + '</span>';
        });
    } else if (q.type === 'true_false') {
        optHtml = '<span class="cq-opt">True</span><span class="cq-opt">False</span>';
    } else if (q.type === 'fill_up') {
        optHtml = '<span class="cq-opt" style="font-style:italic;color:var(--muted)">Text answer</span>';
    }
    opts.innerHTML = optHtml;
    panel.style.display = 'block';
}

function hideCurrentQuestion() {
    document.getElementById('currentQPanel').style.display = 'none';
}

// Show if question already open on page load
if (activeQId !== null && quizData.questions_data && quizData.questions_data[activeQId]) {
    lastQuestion = quizData.questions_data[activeQId];
    showCurrentQuestion(lastQuestion, activeQId);
}

function showAnswerReveal(q, qId, correctAnswer) {
    var panel = document.getElementById('currentQPanel');
    var label = document.getElementById('cqLabel');
    var badge = document.getElementById('cqTypeBadge');
    var textEl = document.getElementById('cqText');
    var opts = document.getElementById('cqOptions');

    var typeMap = {
        'mcq': 'Single correct', 'true_false': 'True / False',
        'fill_up': 'Fill in the blank', 'multi_correct': 'Multi correct'
    };
    label.textContent = 'Q' + (qId + 1) + ' — Closed';
    label.style.color = 'var(--muted)';
    badge.textContent = (typeMap[q.type] || q.type) + ' — Answer revealed';
    badge.className = 'cq-type-badge';
    textEl.innerHTML = (q.q || '').split('\n').map(function(l){return escHtml(l).replace(/\t/g,'\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;').replace(/ {2}/g,'\u0026nbsp;\u0026nbsp;');}).join('<br>');

    var optHtml = '';
    if (q.options && correctAnswer) {
        var correctList = correctAnswer.split(', ');
        q.options.forEach(function(opt, i) {
            var isCorrect = correctList.indexOf(opt) !== -1;
            optHtml += '<span class="cq-opt' + (isCorrect ? ' correct-opt' : '') + '">' +
                String.fromCharCode(65+i) + '. ' + escHtml(opt) + (isCorrect ? ' ✓' : '') + '</span>';
        });
    } else if (correctAnswer) {
        optHtml = '<span class="cq-opt correct-opt">✓ ' + escHtml(correctAnswer) + '</span>';
    }
    opts.innerHTML = optHtml;
    panel.style.display = 'block';
}

function refreshLb() {
    socket.emit('get_leaderboard', { quiz_id: quizId });
}

function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyText(elId, btn) {
    var text = document.getElementById(elId).textContent;
    navigator.clipboard.writeText(text).then(function() {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(function() {
            btn.textContent = elId === 'pinDisplay' ? 'Copy PIN' : 'Copy Link';
            btn.classList.remove('copied');
        }, 1500);
    });
}
</script>
