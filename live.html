<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live_Q — Live View</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0F0F0E;
            --surface: #1A1A18;
            --surface2: #222220;
            --border: #2E2E2B;
            --text: #F0EFE9;
            --muted: #7A7870;
            --accent: #E8A020;
            --accent-dark: #C8880E;
            --green: #3DAA6A;
            --green-dim: #2D7A4F;
            --green-bg: #0D2418;
            --red: #E05252;
            --gold: #F5C842;
            --silver: #B0ADA8;
            --bronze: #C8845A;
            --mono: 'DM Mono', monospace;
            --sans: 'DM Sans', sans-serif;
        }

        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        /* TOP BAR */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 1.5rem;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .brand { font-family: var(--mono); font-size: 0.95rem; font-weight: 500; letter-spacing: 0.05em; }
        .brand span { color: var(--accent); }

        .topbar-center {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .quiz-title-bar {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
        }

        .status-pill {
            font-family: var(--mono);
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            background: var(--green-bg);
            color: var(--green);
            border: 1px solid var(--green-dim);
        }

        .status-pill.idle {
            background: var(--surface2);
            color: var(--muted);
            border-color: var(--border);
        }

        .topbar-right { display: flex; gap: 0.75rem; align-items: center; }

        .btn-sm {
            font-family: var(--sans);
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.3rem 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: none;
            color: var(--muted);
            text-decoration: none;
            transition: border-color 0.15s, color 0.15s;
        }
        .btn-sm:hover { border-color: #555; color: var(--text); }

        /* MAIN LAYOUT */
        .layout {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        /* LEFT PANEL */
        .left-panel {
            width: 340px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: var(--surface);
        }

        @media (max-width: 900px) {
            .layout { flex-direction: column; }
            .left-panel { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
            html, body { overflow: auto; }
        }

        /* JOIN INFO */
        .join-section {
            padding: 1.25rem 1.25rem 1rem;
            border-bottom: 1px solid var(--border);
        }

        .section-label {
            font-family: var(--mono);
            font-size: 0.62rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.875rem;
        }

        .join-inner {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .qr-wrap {
            background: #fff;
            border-radius: 6px;
            padding: 6px;
            flex-shrink: 0;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-wrap img { width: 100%; height: 100%; object-fit: contain; }

        .join-details { flex: 1; min-width: 0; }

        .pin-display {
            font-family: var(--mono);
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .pin-label {
            font-family: var(--mono);
            font-size: 0.62rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.75rem;
        }

        .join-url {
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--muted);
            word-break: break-all;
            line-height: 1.4;
            margin-bottom: 0.5rem;
        }

        .join-url span {
            color: var(--text);
            font-weight: 500;
        }

        .copy-row {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn-copy {
            font-family: var(--mono);
            font-size: 0.65rem;
            font-weight: 500;
            padding: 0.25rem 0.6rem;
            border-radius: 3px;
            border: 1px solid var(--border);
            background: none;
            color: var(--muted);
            cursor: pointer;
            transition: border-color 0.12s, color 0.12s;
        }
        .btn-copy:hover { border-color: var(--accent); color: var(--accent); }
        .btn-copy.copied { border-color: var(--green); color: var(--green); }

        /* QUESTION CONTROLS */
        .questions-section {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 1.25rem;
        }

        .q-controls {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .q-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.6rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--surface2);
            transition: border-color 0.12s;
        }

        .q-row.active {
            border-color: var(--green-dim);
            background: var(--green-bg);
        }

        .q-label {
            font-family: var(--mono);
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--muted);
            flex-shrink: 0;
            width: 2rem;
        }

        .q-row.active .q-label { color: var(--green); }

        .q-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--border);
            flex-shrink: 0;
        }

        .q-row.active .q-dot { background: var(--green); }

        .q-spacer { flex: 1; }

        .q-answered {
            font-family: var(--mono);
            font-size: 0.62rem;
            color: var(--muted);
            flex-shrink: 0;
        }

        .btn-openq {
            font-family: var(--sans);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 3px;
            cursor: pointer;
            border: none;
            flex-shrink: 0;
            transition: opacity 0.12s;
        }

        .btn-openq.open-btn { background: var(--text); color: var(--bg); }
        .btn-openq.open-btn:hover { opacity: 0.8; }
        .btn-openq.close-btn { background: none; color: var(--red); border: 1px solid var(--red); }
        .btn-openq.close-btn:hover { background: rgba(224,82,82,0.1); }

        /* RIGHT PANEL — LEADERBOARD */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg);
        }

        .lb-header {
            padding: 1rem 1.5rem 0.75rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: baseline;
            gap: 1rem;
            flex-shrink: 0;
        }

        .lb-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .lb-subtitle {
            font-family: var(--mono);
            font-size: 0.65rem;
            color: var(--muted);
        }

        .lb-count {
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--accent);
            margin-left: auto;
        }

        .lb-body {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 0;
        }

        /* Leaderboard rows */
        .btn-refresh {
            font-family: var(--mono);
            font-size: 1rem;
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 4px;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.12s, color 0.12s;
            margin-left: 0.5rem;
        }
        .btn-refresh:hover { border-color: var(--accent); color: var(--accent); }

        .lb-row {
            display: flex;
            align-items: center;
            padding: 0.9rem 1.5rem;
            border-bottom: 1px solid var(--border);
            gap: 1rem;
            transition: background 0.15s;
        }

        .lb-row:last-child { border-bottom: none; }
        .lb-row:hover { background: var(--surface2); }

        .lb-row.rank-1 { background: rgba(245,200,66,0.08); border-left: 3px solid var(--gold); }
        .lb-row.rank-2 { background: rgba(176,173,168,0.06); border-left: 3px solid var(--silver); }
        .lb-row.rank-3 { background: rgba(200,132,90,0.06); border-left: 3px solid var(--bronze); }
        .lb-row:not(.rank-1):not(.rank-2):not(.rank-3) { border-left: 3px solid transparent; }

        .lb-rank {
            font-family: var(--mono);
            font-size: 1.5rem;
            font-weight: 700;
            width: 3rem;
            flex-shrink: 0;
            text-align: center;
            line-height: 1;
        }

        .rank-1 .lb-rank { color: var(--gold); font-size: 1.8rem; }
        .rank-2 .lb-rank { color: var(--silver); font-size: 1.6rem; }
        .rank-3 .lb-rank { color: var(--bronze); font-size: 1.5rem; }
        .lb-row:not(.rank-1):not(.rank-2):not(.rank-3) .lb-rank { color: var(--muted); font-size: 1rem; font-weight: 500; }

        .lb-name {
            font-size: 1.2rem;
            font-weight: 700;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: 0.01em;
        }

        .rank-1 .lb-name { font-size: 1.4rem; color: var(--gold); }
        .rank-2 .lb-name { font-size: 1.25rem; }

        .lb-stats {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            flex-shrink: 0;
            gap: 0.1rem;
        }

        .lb-correct {
            font-family: var(--mono);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--green);
            line-height: 1;
        }

        .rank-1 .lb-correct { font-size: 1.8rem; }
        .rank-2 .lb-correct { font-size: 1.6rem; }

        .lb-speed {
            font-family: var(--mono);
            font-size: 0.68rem;
            color: var(--muted);
        }

        .lb-empty {
            padding: 3rem 1.5rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .lb-empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.4; }

        /* Bottom bar */
        .bottom-bar {
            flex-shrink: 0;
            border-top: 1px solid var(--border);
            padding: 0.6rem 1.5rem;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: var(--mono);
            font-size: 0.68rem;
            color: var(--muted);
        }

        .pulse {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            margin-right: 0.4rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .current-q-panel {
            flex-shrink: 0;
            border-top: 2px solid var(--green-dim);
            background: var(--surface);
            padding: 1rem 1.5rem 1.1rem;
            max-height: 260px;
            overflow-y: auto;
        }

        .cq-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.6rem;
        }

        .cq-label {
            font-family: var(--mono);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--green);
        }

        .cq-type-badge {
            font-family: var(--mono);
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            padding: 0.2rem 0.55rem;
            border-radius: 3px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--muted);
        }

        .cq-type-badge.multi { background: rgba(232,160,32,0.15); border-color: var(--accent-dark); color: var(--accent); font-size: 0.7rem; }

        .cq-text {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.45;
            margin-bottom: 0.75rem;
        }

        .cq-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.5rem;
        }

        .cq-opt {
            font-family: var(--mono);
            font-size: 0.82rem;
            padding: 0.35rem 0.7rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            color: var(--text);
            background: var(--surface2);
            line-height: 1.3;
        }

        .cq-opt.correct-opt {
            border-color: var(--green-dim);
            background: var(--green-bg);
            color: var(--green);
        }

        .cq-answer-reveal {
            margin-top: 0.75rem;
            padding: 0.5rem 0.75rem;
            background: var(--green-bg);
            border: 1px solid var(--green-dim);
            border-radius: 4px;
            font-size: 0.82rem;
            color: var(--green);
            font-family: var(--mono);
        }

        .cq-answer-label {
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0.7;
            margin-bottom: 0.2rem;
        }

        .cq-no-question {
            font-size: 0.85rem;
            color: var(--muted);
            font-style: italic;
        }
    </style>
</head>
